format: "PPPyyyy-Ann-Sxz-Mll"
project_code:
  code: PPP
  choices:
    IPA: "InPreD AHUS"
    IPD: "InPreD OUS"
    IPH: "InPreD HUS"
    IPO: "InPreD St. Olav"
patient_code:
  code: yyyy
nucleic_acid_input_type_code:
  code: A
  choices:
    C: "Cell-free samples"
    D: "DNA"
    R: "RNA"
assay_type_code:
  code: nn
  choices:
    "01": "TSO500 DNA"
    "02": "Archer FusionPlex Lung assay"
    "03": "TSO500 RNA"
    "04": "EPIC DNA methylation"
    "05": "Whole-genome DNA sequencing (WGS)"
    "06": "TSO500 HRD (TSO500 solid + HRD)"
    "07": "Whole-transcriptome RNA sequencing (WTS)"
    "50": "[External] Twist Human Core Exome Plus (DNA)"
    "51": "[External] TruSeq Stranded mRNA"
sample_type_code:
  code: S
  choices:
    A: "Post Allotransplantation"
    C: "Cell-line (T)"
    D: "Distal metastasis, naive (T)"
    d: "Distal metastasis, post-treatment (T)"
    E: "Naive"
    e: "Post treatment"
    L: "Liquid (T)"
    M: "Metastasis (T)"
    N: "Normal/control"
    P: "Primary tumor, naive (T)"
    p: "Primary tumor, post-treatment (T)"
    R: "Regional metastasis, naive (T)"
    r: "Regional metastasis, post-treatment (T)"
    T: "Primary tumor (T)"
    X: "Unknown (T)"
library_preparation_attempt:
  code: x
  choices:
    "0": "First try"
    "1": "Second try (e.g., after cleaning, new extraction)"
    "2": "Third try"
    "3": "Fourth try"
    "4": "Fifth try"
    "5": "Sixth try"
    "6": "Seventh try"
    "7": "Eighth try"
    "8": "Nineth try"
    "9": "Validation/verification test;"
biological_replicate:
  code: z
sample_material:
  code: M
  choices:
    A: "Archived (FFPE)"
    B: "Blood"
    C: "Cytology"
    E: "Extramedullary"
    F: "Fresh Frozen"
    M: "Fresh bone Marrow"
    S: "Buccal Swab"
    X: "Unknown"
tumor_site:
  code: ll
  choices:
    "00": "Cancer origo incerta"
    "01": "Adrenal Gland"
    "02": "Ampulla of Vater"
    "03": "Biliary Tract"
