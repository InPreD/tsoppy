    "15": "Lung"
    "16": "Lymphoid"
    "17": "Myeloid"
    "18": "Ovary/Fallopian Tube"
    "19": "Pancreas"
    "20": "Peripheral Nervous System"
    "21": "Peritoneum"
    "22": "Pleura"
    "23": "Prostate"
    "24": "Skin"
    "25": "Soft Tissue"
