version: '3.9'

services:
  tsoppy-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: tsoppy-dev
    volumes:
      - .:/usr/src/app
      - /usr/src/app/.git
    working_dir: /usr/src/app
    command: /bin/bash
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
